version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mingmorsels_app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://postgres:mingmorsels_pass@postgres:5432/mingmorsels
    depends_on:
      - redis
      - postgres
    restart: always

  redis:
    image: redis:7-alpine
    container_name: mingmorsels_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: mingmorsels_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mingmorsels_pass
      POSTGRES_DB: mingmorsels
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  redis_data:
  postgres_data:

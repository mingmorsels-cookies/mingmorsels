<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blog | mingmorsels Bengaluru</title>
  <meta name="description" content="Official Blog of mingmorsels — Handcrafted luxury confectionery in Bengaluru." />
  <meta name="author" content="Miora Delights Private Limited" />
  <meta name="robots" content="index, follow" />

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="canonical" href="https://www.mingmorsels.com/blog.html" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #FAF6F0;
      --white: #FFFFFF;
      --gold: #C8960C;
      --gold-dark: #9E7412;
      --brown: #3D2000;
      --text: #2C1800;
      --muted: #7A5C3E;
      --border: #E8DCBE;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Navbar */
    .nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(250, 246, 240, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .nav-left-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-back-home-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--brown);
      text-decoration: none;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 50px;
      background: #fff;
      transition: all 0.2s;
    }
    .nav-back-home-btn:hover {
      background: #FFF8EC;
      border-color: var(--gold);
      transform: translateX(-2px);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .nav-logo img {
      height: 38px;
      width: auto;
      object-fit: contain;
    }
    .nav-logo-text {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 800;
      color: var(--brown);
    }

    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
    }
    .nav-links a {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active {
      color: var(--brown);
      font-weight: 700;
    }
    .nav-links a.active {
      color: var(--gold-dark);
    }

    .nav-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #FFDF79 0%, #D4AF37 50%, #996515 100%);
      color: #120E0B;
      font-weight: 700;
      font-size: 13px;
      padding: 9px 20px;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(200, 150, 12, 0.25);
      transition: transform 0.2s;
    }
    .nav-cta:hover {
      transform: translateY(-1px);
    }

    /* Empty Blog Canvas */
    .blog-empty-canvas {
      flex: 1;
      min-height: 65vh;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px;
      width: 100%;
    }

    /* Footer */
    .footer {
      background: #120E0B;
      color: #D6C8B4;
      padding: 36px 24px;
      margin-top: auto;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
    }
    .footer-inner {
      max-width: 1140px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 13px;
    }
    .footer-inner a {
      color: #FFDF79;
      text-decoration: none;
    }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .nav-cta { padding: 7px 14px; font-size: 12px; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <nav class="nav">
    <div class="nav-left-group">
      <a href="/" class="nav-back-home-btn" title="Back to Home">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        <span>Home</span>
      </a>
      <a href="/" class="nav-logo">
        <img src="/logo.png?v=2" alt="mingmorsels Logo" loading="lazy" />
        <span class="nav-logo-text">mingmorsels</span>
      </a>
    </div>
    
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/#products">Cookies</a>
      <a href="/#muffins">Muffins</a>
      <a href="/blog.html" class="active">Blog</a>
      <a href="/bulk-order.html">Corporate Orders</a>
      <a href="/experience-center.html">Experience Center</a>
      <a href="/track-order.html">Track Order</a>
    </div>

    <a href="/#products" class="nav-cta">Order Fresh &rarr;</a>
  </nav>

  <!-- Empty Canvas for User's Future Videos and Photos -->
  <main class="blog-empty-canvas" id="blog-content">
    <!-- Blank section ready for videos, reels, and photos -->
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <div>
        <strong>Miora Delights Private Limited</strong> &bull; mingmorsels
        <div style="font-size: 11.5px; color: #A09585; margin-top: 4px;">When moments matter &bull; Bengaluru, Karnataka 560026</div>
      </div>
      <div>
        <a href="/">Home</a> &nbsp;&bull;&nbsp;
        <a href="/#products">Cookies</a> &nbsp;&bull;&nbsp;
        <a href="/#muffins">Muffins</a> &nbsp;&bull;&nbsp;
        <a href="/bulk-order.html">Corporate</a> &nbsp;&bull;&nbsp;
        <a href="/experience-center.html">Experience Center</a>
      </div>
    </div>
  </footer>

</body>
</html>
